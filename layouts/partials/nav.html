<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="{{ strings.TrimSuffix `index.html` .Site.Home.RelPermalink }}" class="nav-logo">GlyphClock</a>
    <div class="nav-actions">
      <button class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="lang-switcher">
        <button class="nav-btn" id="langSwitcherBtn" aria-label="Change language">{{ .Language.Lang | upper }}</button>
        <div class="lang-switcher__list" id="langSwitcherList" style="display:none">
          {{ range .AllTranslations.ByLanguage }}

        </div>
      </div>
    </div>
