{{ define "main" }}
<h1>{{ .Params.heading }}</h1>

<p class="about-text">{{ .Params.updated }}</p>

{{ range .Params.sections }}
<h2 class="privacy-heading">{{ .heading }}</h2>
<p class="about-text">{{ .text | safeHTML }}</p>
{{ end }}

<p class="about-creator">{{ .Params.footer | safeHTML }}</p>
{{ end }}
